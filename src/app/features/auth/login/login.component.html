<div [@pageTransition] class="min-h-screen bg-slate-50 flex justify-center items-center" dir="rtl">
    <div class="card p-5 w-10/12 xl:w-1/2 grid grid-cols-1 md:grid-cols-2">
      <div class="md:block hidden text-white bg-emerald-600 rounded-lg p-8 xl:p-12 text-right">
        <h2 class="text-lg xl:text-2xl pb-3">ساده‌ترین راه برای مدیریت<br>رویدادهای شما</h2>
        <p class="text-xs">برای دسترسی به حساب خود، اطلاعات کاربری را وارد کنید</p>
        <div class="py-8">
          <!-- <img src={{signinBannerImage}} alt="تصویر صفحه ورود" class="border rounded-lg border-emerald-600"> -->
        </div>
      </div>
      <div class="relative flex flex-col p-1 md:p-8 text-right">
        <h2 class="text-lg pb-2">
          شروع کنید
        </h2>
  
        <p class="text-xs">اطلاعات کاربری خود را وارد کنید</p>
  
        <div class="py-6">
            <button 
              type="button" 
              (click)="loginWithGoogle()"
              class="flex items-center justify-center gap-x-2 w-full px-6 py-3 text-sm text-gray-700 font-medium 
                     bg-white border border-gray-200 rounded-lg shadow-sm 
                     hover:bg-emerald-50 hover:border-emerald-200 hover:text-emerald-600
                     focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2
                     transition-all duration-200 ease-in-out">
                     <i class="bi bi-google mr-1"></i>
                     <span>ورود با گوگل</span>
            </button>
          </div>
        <div class="grid grid-cols-5 items-center">
          <div class="col-span-2"><hr></div>
          <p class="text-center">یا</p>
          <div class="col-span-2"><hr></div>
        </div>
  
        <form class="my-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                  ایمیل
                </label>
                <div class="relative">
                  <input 
                    type="email" 
                    id="email" 
                    formControlName="username"
                    placeholder="نام کاربری یا ایمیل خود را وارد کنید"
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-200 pe-10 text-right"
                  >
                  <span class="absolute top-2 left-0 ps-3 text-gray-400">
                    <i class="bi bi-envelope-at"></i>
                </span>
                </div>
              </div>
              <div class="form-group mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                  رمز عبور
                </label>
                <div class="relative">
                  <input 
                    [type]="showPassword ? 'text' : 'password'"
                    id="password" 
                    formControlName="password" 
                    placeholder="رمز عبور خود را وارد کنید"
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-200 pe-20 text-right"
                  >
                  <div class="absolute inset-y-0 right-0 flex items-center">
                    <span class="flex items-center pe-3 text-gray-400">
                      <i class="bi bi-shield-lock text-lg"></i>
                    </span>
                    <button 
                      type="button"
                      (click)="togglePasswordVisibility()"
                      class="pe-3 text-gray-400 hover:text-gray-600 focus:outline-none"
                      [attr.aria-label]="showPassword ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور'"
                    >
                      <i class="bi" [class]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                    </button>
                  </div>
                </div>
              </div>
  
          <div class="text-sm my-4 flex justify-between">
            <div class="inline-flex items-center gap-x-1">
              <input type="checkbox" id="rememberme" class="h-auto cursor-pointer">
              <label for="rememberme" class="cursor-pointer mr-1">مرا به خاطر بسپار</label>
            </div>
            <a href="javascript:void(0)" class="text-emerald-600">فراموشی رمز عبور؟</a>
          </div>
  
          <button type="submit" class="btn w-full btn-theme">
            ورود به حساب کاربری
          </button>
        </form>
  
        <div class="text-sm text-gray-400 text-right">
          <p>حساب کاربری ندارید؟ <a class="text-emerald-600">ثبت نام</a> کنید!</p>
        </div>
      </div>
    </div>
  </div>
